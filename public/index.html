<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Home screen app: name, logo and full-screen look on iOS and Android. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#121316" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hap" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Undo the scroll iOS applies for the keyboard once it closes.
      window.addEventListener("focusout", function () {
        setTimeout(function () {
          if (window.scrollY) window.scrollTo(0, 0);
        }, 60);
      });
      if (window.visualViewport)
        window.visualViewport.addEventListener("resize", function () {
          if (window.visualViewport.height >= window.innerHeight - 1 && window.scrollY) window.scrollTo(0, 0);
        });
      if ("serviceWorker" in navigator)
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #121316;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* iOS home screen apps: after the keyboard closes, Safari can leave the
         page scrolled or shrunk, so the tab bar moves up. Pinning the body to
         the screen edges keeps the layout at full height. */
      body {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        height: auto;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
